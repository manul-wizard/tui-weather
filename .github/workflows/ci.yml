name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      - name: Staticcheck
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - run: go test ./...

      - name: Check that the release config is valid
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
